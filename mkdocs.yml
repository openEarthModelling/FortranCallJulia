site_name: FortranCallJulia
site_url: https://openearthmodelling.github.io/FortranCallJulia/
copyright: FortranCallJulia - MIT License

theme:
  name: material
  logo: assets/logo-square.png
  favicon: assets/favicon.png

plugins:
  - search
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 简体中文
          build: true
          # zh-only annex: the global nav below lists only pages available in
          # the default (en) build; this per-locale nav adds the single-language
          # figures annex, which mkdocs-static-i18n resolves per language in
          # folder mode. annex-performance (en-only) resolves here through the
          # plugin's default-language fallback. Future nav edits must touch
          # both places: this per-locale nav and the global nav at the bottom
          # of this file.
          nav:
            - index.md
            - Introduction:
                - intro/what-is-this.md
                - intro/why-fortran-julia.md
                - intro/architecture.md
                - intro/validation.md
            - User Guide:
                - user/installation.md
                - user/first-call.md
                - user/two-sdks.md
                - user/arrays-and-callbacks.md
                - user/deployment-modes.md
                - user/bring-your-own-kinetics.md
                - user/known-limitations.md
            - Developer Guide:
                - developer/repository-tour.md
                - developer/bridge-internals.md
                - developer/acceptance-gates.md
                - developer/lessons.md
                - developer/rebuild.md
                - developer/contributing.md
                - developer/further-reading.md
                - developer/annex-performance.md
                - developer/annex-figures.md
          nav_translations:
            Introduction: 入门
            User Guide: 用户指南
            Developer Guide: 开发者指南

exclude_docs: |
  superpowers/**
  references/**

nav:
  - index.md
  - Introduction:
      - intro/what-is-this.md
      - intro/why-fortran-julia.md
      - intro/architecture.md
      - intro/validation.md
  - User Guide:
      - user/installation.md
      - user/first-call.md
      - user/two-sdks.md
      - user/arrays-and-callbacks.md
      - user/deployment-modes.md
      - user/bring-your-own-kinetics.md
      - user/known-limitations.md
  - Developer Guide:
      - developer/repository-tour.md
      - developer/bridge-internals.md
      - developer/acceptance-gates.md
      - developer/lessons.md
      - developer/rebuild.md
      - developer/contributing.md
      - developer/further-reading.md
      - developer/annex-performance.md

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.details
  - smarty
  # Math rendering for the figures annex ($$...$$ / $...$), the only
  # math-bearing pages on the site; loaded after smarty so math spans are
  # stashed before smart-quote/dash processing touches them.
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
